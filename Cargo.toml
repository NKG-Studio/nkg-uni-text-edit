[workspace]
members = [
    "crates/text-engine",
    "crates/nkg-cli",
    "crates/nkg-desktop",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
aho-corasick = "1.1.3"
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive"] }
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
memchr = "2.8.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
